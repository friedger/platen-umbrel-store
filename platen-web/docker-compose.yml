version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: platen-web_server_1
      APP_PORT: 80
      # No Umbrel login for the landing page — it is meant to be open
      # to everyone on the home network.
      PROXY_AUTH_ADD: "false"

  server:
    image: nginx:alpine
    restart: on-failure
    extra_hosts:
      # lets nginx reach Barcode Buddy on the host (port 9280)
      - "host.docker.internal:host-gateway"
    volumes:
      # www is writable: the inventory editor saves via nginx dav PUT.
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html
      - ${APP_DATA_DIR}/data/conf:/etc/nginx/conf.d:ro
