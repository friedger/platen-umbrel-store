manifestVersion: 1
id: platen-web
name: Platen Web
icon: https://cdn.jsdelivr.net/gh/friedger/platen-umbrel-store@main/platen-web/icon.svg
tagline: Static home page for the household
category: networking
version: "1.1.1"
port: 8080
description: >-
  Tiny nginx web server for the family landing page. Content lives in
  the app's data directory (app-data/platen-web/data/www) and can be
  updated with a simple rsync — no restart needed.
developer: Friedger
website: https://github.com/friedger/platen-umbrel-store
repo: https://github.com/friedger/platen-umbrel-store
support: https://github.com/friedger/platen-umbrel-store/issues
gallery: []
releaseNotes: >-
  Inventory editor: nginx config is now mounted from the app data dir and
  allows PUT on /barcode/inventory.json so edits made in the browser are
  saved on the server.
dependencies: []
path: ""
